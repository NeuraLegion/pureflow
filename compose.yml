services:
  db:
    image: 'postgres:17-alpine'
    restart: on-failure
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}']
      timeout: 45s
    environment:
      POSTGRES_DB: bc
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
    ports:
      - '5432:5432'
    volumes:
      - './pg.sql:/docker-entrypoint-initdb.d/pg.sql'
      - '.data/nodejs:/var/lib/postgresql/data'

  nodejs:
    # image: dull/pureflow  # replaced — must build from source
    build:
      context: .
    restart: on-failure
    ports:
      - '3000:3000'
    healthcheck:
      interval: 5s
      retries: 10
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/config']
      timeout: 30s
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_SCHEMA: bc
      DATABASE_USER: bc
      DATABASE_PASSWORD: bc
      DATABASE_PORT: 5432
      KEYCLOAK_SERVER_URI: http://keycloak:8080
      KEYCLOAK_REALM: pureflow
      KEYCLOAK_PUBLIC_CLIENT_ID: pureflow-client
      KEYCLOAK_PUBLIC_CLIENT_SECRET: 4bfb5df6-4647-46dd-bad1-c8b8ffd7caf4
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_CLIENT_SECRET: 3abff4a7-6649-4bae-a105-9bd1fb52a2cd
      JWT_PRIVATE_KEY_LOCATION: /usr/src/app/config/keys/jwtRS256.key
      JWT_PUBLIC_KEY_LOCATION: /usr/src/app/config/keys/jwtRS256.key.pub.pem
      JWT_SECRET_KEY: dev-secret
      JWT_CONFIGS_URI: file:///usr/src/app/config/keys/jku.json
      JWK_PRIVATE_KEY_LOCATION: /usr/src/app/config/keys/jwk.key.pem
      JWK_PUBLIC_KEY_LOCATION: /usr/src/app/config/keys/jwk.pub.key.pem
      JWK_PUBLIC_JSON: /usr/src/app/config/keys/jwk.pub.json
      JKU_URL: http://nodejs:3000/.well-known/jwks.json
      X5U_URL: http://nodejs:3000/.well-known/x5u.pem
      CHAT_API_URL: http://ollama:11434/v1/chat/completions
      CHAT_API_MODEL: smollm:135m
      CHAT_API_TOKEN: ''
      CHAT_API_MAX_TOKENS: 200
      URL: http://localhost:3000
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: 3.5
    logging:
      options:
        max-file: '5'
        max-size: '10m'
    depends_on:
      db:
        condition: service_healthy
      mailcatcher:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ollama:
        condition: service_healthy


  keycloak-db:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
    restart: on-failure
    volumes:
      - '.data/keycloak:/var/lib/postgresql/data'

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.1.2'
    volumes:
      - './keycloak/imports/realm-export.json:/opt/keycloak/data/import/realm-export.json'
    command: start-dev --import-realm
    ports:
      - '8080:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Pa55w0rd
      KC_HEALTH_ENABLED: true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e \"GET /health/ready HTTP/1.1\r\nhost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"
        ]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 5s
    depends_on:
      - keycloak-db

  mailcatcher:
    image: 'sj26/mailcatcher'
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:1080']
      timeout: 45s
    restart: on-failure
    ports:
      - '1080:1080'
      - '1025:1025'
    logging:
      options:
        max-file: '5'
        max-size: '10m'

  ollama:
    image: 'brightsec/brokencrystals-ollama:smollm135m'
    restart: on-failure
    healthcheck:
      interval: 30s
      retries: 5
      test: ['CMD', 'ollama', 'list']
      timeout: 10s
      start_period: 60s
    ports:
      - '11434:11434'
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: 2.0
    logging:
      options:
        max-file: '5'
        max-size: '10m'

volumes:
  letsencrypt:
